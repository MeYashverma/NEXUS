name: Build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        working-directory: app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Assemble release APK
        working-directory: app
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Surface failures in the step summary
        if: failure()
        run: |
          {
            echo "## Build failure"
            echo '```'
            find app/app/build/reports -type f -name "*.html" 2>/dev/null | head -3
            cat app/app/build/reports/tests/*/classes/*.html 2>/dev/null | grep -oE "<pre>[^<]*" | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record checksums
        if: always()
        run: |
          find app/app/build/outputs -name "*.apk" -exec sha256sum {} \; || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: elevon-apks
          if-no-files-found: error
          path: |
            app/app/build/outputs/apk/debug/*.apk
            app/app/build/outputs/apk/release/*.apk
