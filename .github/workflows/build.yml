name: Build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-test.log

      - name: Assemble debug APK
        if: success() || failure()
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Assemble release APK
        if: success()
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Surface failures in the step summary
        if: failure()
        working-directory: app
        run: |
          {
            echo "## Kotlin compile errors"
            grep -hE "^e: " *.log | head -100 || echo "(none found)"
            echo
            echo "## Failure reason"
            grep -hE "FAILURE: Build failed|What went wrong|> Task.*FAILED|Caused by:" *.log | head -30 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Sandbox note: Actions log downloads are blocked from this environment,
      # so on failure we commit the tail of the log back to the branch via the
      # Contents API (no git push needed).
      - name: Dump failure log to branch
        if: failure() && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MSG" in
            "ci(logs)"*) echo "Log dump commit; not recursing."; exit 0;;
          esac
          mkdir -p ci-logs
          {
            echo "# Kotlin compile errors"
            grep -hE "^e: " app/*.log 2>/dev/null | head -200
            echo
            echo "# Failure reason"
            grep -hE "FAILURE: Build failed|What went wrong|> Task.*FAILED|Caused by:" app/*.log 2>/dev/null | head -40
            echo
            echo "# Log tails"
            for f in app/*.log; do
              [ -e "$f" ] || continue
              echo "## $f"
              tail -100 "$f"
            done
          } > ci-logs/last-failure.md
          B64=$(base64 -w0 ci-logs/last-failure.md)
          if gh api "repos/${{ github.repository }}/contents/ci-logs/last-failure.md" \
              -X PUT -f message="ci(logs): record build failure" \
              -f content="$B64" -f branch="${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Failure log committed to branch ci-logs/last-failure.md"
          else
            echo "Contents-API commit failed"
          fi
          exit 0

      - name: Record checksums
        if: always()
        run: |
          find app/app/build/outputs -name "*.apk" -exec sha256sum {} \; || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: elevon-apks
          if-no-files-found: error
          path: |
            app/app/build/outputs/apk/debug/*.apk
            app/app/build/outputs/apk/release/*.apk
