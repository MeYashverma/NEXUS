name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: app
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release-run.log

      - name: Collect APKs and checksums
        run: |
          mkdir -p dist
          cp app/app/build/outputs/apk/debug/*.apk dist/ || true
          cp app/app/build/outputs/apk/release/*.apk dist/ || true
          cd dist
          for f in *.apk; do mv "$f" "elevon-$f" 2>/dev/null || true; done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view v0.1.0 --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release exists; uploading assets"
            gh release upload v0.1.0 --repo "${{ github.repository }}" dist/* --clobber
          else
            gh release create v0.1.0 \
              --repo "${{ github.repository }}" \
              --target "$SHA" \
              --title "Elevon v0.1.0 — Your phone. Your controls." \
              --notes-file .github/RELEASE_NOTES_v0.1.0.md \
              dist/*
          fi
